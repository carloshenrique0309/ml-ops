<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Resultados de Churn</title>
<style>
  :root {
    --bg: #f4f6fb;
    --card: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --border: #e5e7eb;
    --primary: #2563eb;
    --danger: #dc2626;
    --danger-bg: #fee2e2;
    --ok: #047857;
    --ok-bg: #d1fae5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 15px;
  }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 32px 20px 48px; }
  header { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: baseline; justify-content: space-between; }
  h1 { margin: 0; font-size: 26px; }
  .muted { color: var(--muted); font-size: 13px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 24px 0; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px; box-shadow: 0 1px 2px rgba(16, 24, 40, .04);
  }
  .card .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .card .value { font-size: 26px; font-weight: 600; margin-top: 6px; }
  .toolbar {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px;
  }
  .toolbar input[type="search"] { flex: 1 1 260px; }
  input, select, button {
    font: inherit; color: inherit; background: #fff;
    border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px;
  }
  input:focus, select:focus, button:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }
  button { cursor: pointer; }
  button.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  .table-wrap {
    margin-top: 16px; background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; overflow: auto; box-shadow: 0 1px 2px rgba(16, 24, 40, .04);
  }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); background: #fafafa; position: sticky; top: 0; }
  tbody tr:hover { background: #f9fafb; }
  tbody tr:last-child td { border-bottom: none; }
  .prob { display: flex; align-items: center; gap: 8px; min-width: 130px; }
  .prob .track { width: 70px; height: 6px; border-radius: 999px; background: var(--border); overflow: hidden; }
  .prob .fill { height: 100%; border-radius: 999px; background: var(--primary); }
  .badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .badge.churn { background: var(--danger-bg); color: var(--danger); }
  .badge.ok { background: var(--ok-bg); color: var(--ok); }
  .pager { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 14px; }
  .empty { padding: 32px; text-align: center; color: var(--muted); }
  .error {
    margin-top: 14px; padding: 12px 14px; border-radius: 10px;
    background: var(--danger-bg); color: var(--danger); border: 1px solid #fecaca;
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Resultados de Churn</h1>
      <div class="muted">Consulta do batch scoring — sem inferência.</div>
    </div>
    <div class="muted" id="source">carregando…</div>
  </header>

  <div class="error" id="error" hidden></div>

  <section class="cards" aria-label="Resumo">
    <div class="card"><div class="label">Clientes</div><div class="value" id="kpi-total">—</div></div>
    <div class="card"><div class="label">Em risco</div><div class="value" id="kpi-churn">—</div></div>
    <div class="card"><div class="label">Sem risco</div><div class="value" id="kpi-ok">—</div></div>
    <div class="card"><div class="label">Taxa de churn</div><div class="value" id="kpi-rate">—</div></div>
    <div class="card"><div class="label">Prob. média</div><div class="value" id="kpi-prob">—</div></div>
  </section>

  <section class="toolbar" aria-label="Filtros">
    <input id="q" type="search" placeholder="Buscar por cliente, contrato, etc." aria-label="Buscar">
    <select id="prediction" aria-label="Filtrar por risco">
      <option value="">Todos</option>
      <option value="churn">Em risco</option>
      <option value="no_churn">Sem risco</option>
    </select>
    <select id="limit" aria-label="Registros por página">
      <option value="10">10 por página</option>
      <option value="25" selected>25 por página</option>
      <option value="50">50 por página</option>
      <option value="100">100 por página</option>
    </select>
    <button id="reload" class="primary" title="Reler o arquivo de resultados">Atualizar</button>
  </section>

  <div class="table-wrap">
    <table id="table">
      <thead></thead>
      <tbody></tbody>
    </table>
    <p class="empty" id="empty" hidden>Nenhum resultado encontrado.</p>
  </div>

  <div class="pager">
    <button id="prev">Anterior</button>
    <span class="muted" id="page">—</span>
    <button id="next">Próxima</button>
  </div>
</div>

<script>
const state = { offset: 0, limit: 25, q: "", prediction: "", summary: null };

const el = (id) => document.getElementById(id);
const truthy = new Set(["1", "true", "yes", "y", "sim", "churn", "churned", "em risco"]);

async function fetchJSON(url, options) {
  const response = await fetch(url, options);
  if (!response.ok) {
    const body = await response.json().catch(() => ({}));
    throw new Error(body.detail || response.statusText);
  }
  return response.json();
}

function showError(message) {
  const box = el("error");
  box.textContent = message;
  box.hidden = !message;
}

function percent(value) {
  if (value === null || value === undefined || Number.isNaN(Number(value))) return "—";
  return `${(Number(value) * 100).toFixed(1)}%`;
}

function label(column) {
  if (!state.summary) return column;
  if (column === state.summary.id_column) return "Cliente";
  if (column === state.summary.probability_column) return "Probabilidade";
  if (column === state.summary.prediction_column) return "Predição";
  return column.replace(/_/g, " ").replace(/^\w/, (c) => c.toUpperCase());
}

function orderedColumns(keys) {
  const first = [state.summary?.id_column, state.summary?.probability_column, state.summary?.prediction_column];
  const head = first.filter((column) => column && keys.includes(column));
  return [...head, ...keys.filter((key) => !head.includes(key))];
}

function renderCell(td, column, value) {
  if (value === null || value === undefined || value === "") {
    td.textContent = "—";
    td.className = "muted";
    return;
  }

  if (state.summary && column === state.summary.probability_column) {
    const pct = Math.max(0, Math.min(1, Number(value)));
    td.innerHTML = "";
    const wrap = document.createElement("div");
    wrap.className = "prob";
    const track = document.createElement("span");
    track.className = "track";
    const fill = document.createElement("span");
    fill.className = "fill";
    fill.style.width = `${(pct * 100).toFixed(0)}%`;
    track.appendChild(fill);
    const text = document.createElement("span");
    text.textContent = percent(pct);
    wrap.append(track, text);
    td.appendChild(wrap);
    return;
  }

  if (state.summary && column === state.summary.prediction_column) {
    const isChurn = truthy.has(String(value).toLowerCase());
    const badge = document.createElement("span");
    badge.className = `badge ${isChurn ? "churn" : "ok"}`;
    badge.textContent = isChurn ? "Churn" : "Não churn";
    td.appendChild(badge);
    return;
  }

  td.textContent = String(value);
}

function renderTable(items) {
  const table = el("table");
  const thead = table.tHead;
  const tbody = table.tBodies[0];
  thead.innerHTML = "";
  tbody.innerHTML = "";

  el("empty").hidden = items.length > 0;
  if (!items.length) return;

  const columns = orderedColumns(Object.keys(items[0]));
  const headerRow = document.createElement("tr");
  for (const column of columns) {
    const th = document.createElement("th");
    th.textContent = label(column);
    headerRow.appendChild(th);
  }
  thead.appendChild(headerRow);

  for (const item of items) {
    const row = document.createElement("tr");
    for (const column of columns) {
      const td = document.createElement("td");
      renderCell(td, column, item[column]);
      row.appendChild(td);
    }
    tbody.appendChild(row);
  }
}

async function loadSummary() {
  const data = await fetchJSON("/api/summary");
  state.summary = data;

  el("kpi-total").textContent = data.total.toLocaleString("pt-BR");
  el("kpi-churn").textContent = data.churn === null ? "—" : data.churn.toLocaleString("pt-BR");
  el("kpi-ok").textContent = data.not_churn === null ? "—" : data.not_churn.toLocaleString("pt-BR");
  el("kpi-rate").textContent = percent(data.churn_rate);
  el("kpi-prob").textContent = percent(data.average_probability);

  const updated = data.updated_at ? new Date(data.updated_at).toLocaleString("pt-BR") : "—";
  el("source").textContent = `${data.source} · atualizado em ${updated}`;
}

async function loadResults() {
  const params = new URLSearchParams({ limit: state.limit, offset: state.offset });
  if (state.q) params.set("q", state.q);
  if (state.prediction) params.set("prediction", state.prediction);

  const data = await fetchJSON(`/api/results?${params}`);
  renderTable(data.items);

  const pages = Math.max(1, Math.ceil(data.total / state.limit));
  const current = Math.floor(state.offset / state.limit) + 1;
  el("page").textContent = `Página ${current} de ${pages} · ${data.total.toLocaleString("pt-BR")} registros`;
  el("prev").disabled = state.offset === 0;
  el("next").disabled = state.offset + state.limit >= data.total;
}

async function refresh() {
  try {
    await loadSummary();
    await loadResults();
    showError("");
  } catch (error) {
    showError(error.message);
  }
}

let debounce;
el("q").addEventListener("input", (event) => {
  clearTimeout(debounce);
  debounce = setTimeout(() => {
    state.q = event.target.value.trim();
    state.offset = 0;
    refresh();
  }, 300);
});

el("prediction").addEventListener("change", (event) => {
  state.prediction = event.target.value;
  state.offset = 0;
  refresh();
});

el("limit").addEventListener("change", (event) => {
  state.limit = Number(event.target.value);
  state.offset = 0;
  refresh();
});

el("prev").addEventListener("click", () => {
  state.offset = Math.max(0, state.offset - state.limit);
  loadResults().catch((error) => showError(error.message));
});

el("next").addEventListener("click", () => {
  state.offset += state.limit;
  loadResults().catch((error) => showError(error.message));
});

el("reload").addEventListener("click", async () => {
  const button = el("reload");
  button.disabled = true;
  button.textContent = "Atualizando…";
  try {
    await fetchJSON("/api/reload", { method: "POST" });
    await refresh();
    button.textContent = "Atualizado!";
  } catch (error) {
    showError(error.message);
    button.textContent = "Atualizar";
  } finally {
    setTimeout(() => {
      button.textContent = "Atualizar";
      button.disabled = false;
    }, 1200);
  }
});

refresh();
</script>
</body>
</html>
