[project]
name = "churn"
version = "0.1.0"
description = "Modelo de churn"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dvc>=3.67.1",
    "matplotlib>=3.11.1",
    "mlflow>=3.16.0",
    "pandas>=3.0.5",
    "pandera>=0.33.1",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
